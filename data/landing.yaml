    bg_classes: lp-bg bg-aging
    bg_alt: Aging
    title_img: /assets/landing/aging_font_fjq8rg.svg
    cursor: /assets/landing/aging_arrow_2_eorxgd.svg
    text_classes: lp-text lp-text-aging
