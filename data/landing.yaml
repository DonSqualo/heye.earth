# Landing page slides. This replaces the `landingPageItems` array of the old Home.js.
#
# Image placement: the old site asked Cloudinary for a viewport-sized crop; the same
# framing is now done with object-fit:cover + object-position (bg_pos / bg_pos_mobile).
# Cloudinary's x_/y_ offsets are relative to the gravity anchor, e.g. g_north + y_200
# -> "center -200px", g_east + y_200 -> "right calc(50% - 200px)".
# The template renders exactly the DOM the old Home.js used to build at runtime.
items:
  - text: Writings
    path: /writings-and-notes
    query: "/[...page]?page=writing-db&page=writings-and-notes"
    bg: /assets/landing/Writings_and_Notes_Background_sssvel.png
    bg_pos: left center
    bg_pos_mobile: left center
    bg_classes: lp-bg bg-writings
    bg_alt: Writings and Notes
    title_img: /assets/landing/2_tuhqcg.svg
    title_video: /assets/landing/Writings_v2_yssfqw.webm
    cursor: /assets/landing/Writing_Arrow_hzu1rv.svg
    text_classes: lp-text lp-text-writings
    button: lp-read-more-button-writings

  - text: Aging
    path: /projects/why-im-solving-aging
